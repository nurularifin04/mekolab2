<!DOCTYPE html>
<html>
<head>
    <title>YouTube PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
</head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>YouTube PWA Wrapper</h2>
    <p id="msg">Menunggu respon browser...</p>
    <button id="btn" style="display:none; padding:15px; background:red; color:white; border:none; border-radius:8px;">INSTAL SEKARANG</button>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("SW Registered"));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btn').style.display = 'block';
            document.getElementById('msg').innerText = 'Klik tombol di bawah:';
        });

        document.getElementById('btn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            }
        });

        // Jika dibuka dari layar utama, langsung ke YT
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.location.href = "https://m.youtube.com";
        }
    </script>
</body>
</html>
