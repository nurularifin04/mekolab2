<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1,0 viewport-fit=cover">
  
  <link rel="icon" type="image/png" href="../assets/icon.ml2.png" sizes="96x96"/>
  <title>MekoLab: Mekorama Level Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_left_alt,arrow_right_alt,cancel,check,circle,close,data_table,deployed_code,download,edit,image_arrow_up,qr_code,save" />
  <link rel="stylesheet" type="text/css" href="css/style.ml2.css">
  
</head>
<body>
  <!-- MAIN PAGE -->
  <div class="main-page">
    <header>
      <h1>MekoLab</h1><h3>2.0</h3>
    </header>
    <main id="card-collector"></main>
    <footer>
      <input id="image-input" type="file" multiple accept="image/*">
      <p>Upload Level</p>
      <button id="upload-level">add_photo_alternate</button>
      <p>Fullscreen</p>
      <button id="toggle-fullscreen">fullscreen</button>
      <p>Reload</p>
      <button id="reload">refresh</button>
      <p>Version 1.0</p>
      <button id="app-version">first_page</button>
    </footer>
  </div>
  
  <div class="main-toolbar">
    <button id="delete-card">delete</button>
    <button id="play-online">play_arrow</button>
    <button id="level-editor">brick</button>
    <button id="share-card">share</button>
  </div>
  
  <!-- EDITOR PAGE -->
  <div class="edit-page hidden">
    <div class="edit-topbar">
      <button id="close">close</button>
      <button id="save">save</button>
      <button id="info">info</button>
      <button id="undo" disabled="true" style="scale: -1 1">refresh</button>
      <button id="redo" disabled="true">refresh</button>
    </div>
    <div class="info hidden">
      <input type="text" id="title-input" maxlength="16" placeholder="Level Name (max 16 character)">
      <input type="text" id="author-input" maxlength="16" placeholder="Your Name (max 16 character)">
    </div>
    <div class="edit-content">
      <div id="layer-wrapper"></div>
      <div id="layer-state"></div>
    </div>
    <div class="edit-bottombar"></div>
  </div>
  
  <!-- MODAL -->
  <dialog class="ml2-modal"></dialog>
  <iframe src="https://www.mekorama.com/play" width="100%" height="600" frameborder="0" allowfullscreen></iframe>
  
  <!-- SCRIPT -->
  <script src="debug.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
